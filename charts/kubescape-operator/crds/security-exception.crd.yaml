apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: securityexceptions.kubescape.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: kubescape.io
  names:
    plural: securityexceptions
    singular: securityexception
    kind: SecurityException
    shortNames:
      - se
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              properties:
                author:
                  type: string
                reason:
                  type: string
                  enum:
                    - accepted-risk
                    - false-positive
                    - compensating-control
                    - will-not-fix
                    - other
                expiresAt:
                  type: string
                  format: date-time
                match:
                  type: object
                  properties:
                    objectSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    resources:
                      type: array
                      items:
                        type: object
                        required:
                          - kind
                        properties:
                          apiGroup:
                            type: string
                          kind:
                            type: string
                          name:
                            type: string
                    images:
                      type: array
                      items:
                        type: string
                vulnerabilities:
                  type: array
                  items:
                    type: object
                    required:
                      - vulnerability
                      - status
                    properties:
                      vulnerability:
                        type: object
                        required:
                          - id
                        properties:
                          id:
                            type: string
                          aliases:
                            type: array
                            items:
                              type: string
                      status:
                        type: string
                        enum:
                          - not_affected
                          - fixed
                          - under_investigation
                      justification:
                        type: string
                        enum:
                          - component_not_present
                          - vulnerable_code_not_present
                          - vulnerable_code_not_in_execute_path
                          - vulnerable_code_cannot_be_controlled_by_adversary
                          - inline_mitigations_already_exist
                      impactStatement:
                        type: string
                      expiredOnFix:
                        type: boolean
                posture:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - controlID
                      - action
                    properties:
                      controlID:
                        type: string
                        pattern: '^C-[0-9]{4}$'
                      frameworkName:
                        type: string
                      action:
                        type: string
                        enum:
                          - ignore
                          - alert_only
              # CEL validation rules
              x-kubernetes-validations:
                - rule: "has(self.posture) || has(self.vulnerabilities)"
                  message: "spec must have at least one of: posture, vulnerabilities"
            status:
              type: object
              properties:
                matchCount:
                  type: integer
                lastMatchedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Reason
          type: string
          jsonPath: .spec.reason
        - name: Expires
          type: string
          jsonPath: .spec.expiresAt
        - name: Controls
          type: string
          jsonPath: .spec.posture[*].controlID
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
