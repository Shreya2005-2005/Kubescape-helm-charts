apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustersecurityexceptions.kubescape.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: kubescape.io
  names:
    plural: clustersecurityexceptions
    singular: clustersecurityexception
    kind: ClusterSecurityException
    shortNames:
      - cse
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              properties:
                author:
                  type: string
                reason:
                  type: string
                  enum:
                    - accepted-risk
                    - false-positive
                    - compensating-control
                    - will-not-fix
                    - other
                expiresAt:
                  type: string
                  format: date-time
                match:
                  type: object
                  properties:
                    namespaceSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    objectSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    resources:
                      type: array
                      items:
                        type: object
                        required:
                          - kind
                        properties:
                          apiGroup:
                            type: string
                          kind:
                            type: string
                          name:
                            type: string
                    images:
                      type: array
                      items:
                        type: string
                vulnerabilities:
                  type: array
                  items:
                    type: object
                    required:
                      - vulnerability
                      - status
                    properties:
                      vulnerability:
                        type: object
                        required:
                          - id
                        properties:
                          id:
                            type: string
                      status:
                        type: string
                        enum:
                          - not_affected
                          - fixed
                          - under_investigation
                      justification:
                        type: string
                        enum:
                          - component_not_present
                          - vulnerable_code_not_present
                          - vulnerable_code_not_in_execute_path
                          - vulnerable_code_cannot_be_controlled_by_adversary
                          - inline_mitigations_already_exist
                      impactStatement:
                        type: string
                      expiredOnFix:
                        type: boolean
                posture:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - controlID
                      - action
                    properties:
                      controlID:
                        type: string
                        pattern: '^C-[0-9]{4}$'
                      frameworkName:
                        type: string
                      action:
                        type: string
                        enum:
                          - ignore
                          - alert_only
              x-kubernetes-validations:
                - rule: "has(self.posture) || has(self.vulnerabilities)"
                  message: "spec must have at least one of: posture, vulnerabilities"
            status:
              type: object
              properties:
                matchCount:
                  type: integer
                lastMatchedAt:
                  type: string
      additionalPrinterColumns:
        - name: Reason
          type: string
          jsonPath: .spec.reason
        - name: Expires
          type: string
          jsonPath: .spec.expiresAt
        - name: Controls
          type: string
          jsonPath: .spec.posture[*].controlID
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
